[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "context-engine"
version = "0.1.0"
description = "Agent-agnostic context engine for discovering and supplying domain knowledge"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Context Engine contributors" }]
dependencies = [
    "mcp>=1.0,<2",
    "pydantic>=2.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[project.scripts]
context-engine-mcp = "context_engine.adapters.mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/context_engine"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/knowledge",
    "/tests",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
